<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="언어의 결 편집 노트를 상징하는 일러스트">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1815"/>
      <stop offset="55%" stop-color="#221d19"/>
      <stop offset="100%" stop-color="#171310"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="72%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#A63D32" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#A63D32" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#A63D32" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroGlowTeal" cx="86%" cy="82%" r="40%">
      <stop offset="0%" stop-color="#3E7475" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3E7475" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#heroBg)"/>
  <rect width="1600" height="900" fill="url(#heroGlow)"/>
  <rect width="1600" height="900" fill="url(#heroGlowTeal)"/>

  <!-- faint notebook rule lines -->
  <g stroke="#F5F0E7" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="120" x2="1600" y2="120"/>
    <line x1="0" y1="200" x2="1600" y2="200"/>
    <line x1="0" y1="280" x2="1600" y2="280"/>
    <line x1="0" y1="360" x2="1600" y2="360"/>
    <line x1="0" y1="440" x2="1600" y2="440"/>
    <line x1="0" y1="520" x2="1600" y2="520"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="680" x2="1600" y2="680"/>
    <line x1="0" y1="760" x2="1600" y2="760"/>
    <line x1="0" y1="840" x2="1600" y2="840"/>
  </g>

  <!-- open book / conversation spread, right side -->
  <g transform="translate(980,300)" opacity="0.92">
    <path d="M0 60 C 140 10, 280 10, 420 60 L 420 430 C 280 380, 140 380, 0 430 Z" fill="#F5F0E7" opacity="0.06"/>
    <path d="M420 60 C 560 10, 700 10, 840 60 L 840 430 C 700 380, 560 380, 420 430 Z" fill="#F5F0E7" opacity="0.09"/>
    <line x1="420" y1="60" x2="420" y2="430" stroke="#A63D32" stroke-opacity="0.5" stroke-width="2"/>
    <!-- abstract handwritten note strokes, left page -->
    <g stroke="#F5F0E7" stroke-opacity="0.32" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M60 140 C 110 130, 160 150, 210 138"/>
      <path d="M60 180 C 130 168, 190 190, 300 176"/>
      <path d="M60 220 C 100 212, 150 228, 190 216"/>
    </g>
    <!-- abstract brush strokes, right page (evokes 汉字 gesture without literal characters) -->
    <g stroke="#D9B495" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M520 130 L 520 260"/>
      <path d="M480 160 L 560 160"/>
      <path d="M620 120 C 640 160, 600 220, 640 270"/>
      <path d="M700 140 L 700 250"/>
      <path d="M670 190 L 740 190"/>
    </g>
  </g>

  <!-- large watermark waveform / 人 mark -->
  <g transform="translate(150,560) scale(2.6)" fill="#A63D32" opacity="0.16">
    <rect x="10.5" y="70" width="7" height="14" rx="3"/>
    <rect x="19.5" y="60" width="7" height="24" rx="3"/>
    <rect x="28.5" y="48" width="7" height="36" rx="3"/>
    <rect x="37.5" y="36" width="7" height="48" rx="3"/>
    <rect x="45.5" y="24" width="7" height="60" rx="3"/>
    <rect x="47.5" y="24" width="7" height="60" rx="3"/>
    <rect x="55.5" y="36" width="7" height="48" rx="3"/>
    <rect x="64.5" y="48" width="7" height="36" rx="3"/>
    <rect x="73.5" y="60" width="7" height="24" rx="3"/>
    <rect x="82.5" y="70" width="7" height="14" rx="3"/>
  </g>

  <!-- floating quote mark + burgundy annotation seal, echoing the design system -->
  <g transform="translate(210,220)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#A63D32" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="0" y="10" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#A63D32" fill-opacity="0.85">&#8220;</text>
  </g>

  <g stroke="#D9B495" stroke-opacity="0.4" stroke-width="1.5">
    <line x1="120" y1="700" x2="360" y2="700"/>
  </g>
</svg>
