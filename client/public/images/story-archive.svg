<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" role="img" aria-label="언어 교육 현장 경험을 상징하는 노트와 아카이브 오브제 일러스트">
  <defs>
    <linearGradient id="storyBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFE8D9"/>
      <stop offset="100%" stop-color="#E1D5BE"/>
    </linearGradient>
  </defs>

  <rect width="800" height="900" fill="url(#storyBg)"/>

  <!-- soft shadow -->
  <ellipse cx="410" cy="700" rx="300" ry="40" fill="#292522" opacity="0.08"/>

  <!-- stack of archive cards, tied -->
  <g transform="translate(150,470)">
    <rect x="0" y="40" width="260" height="150" rx="4" fill="#D8CBB0" transform="rotate(-4 130 115)"/>
    <rect x="10" y="20" width="260" height="150" rx="4" fill="#E6DCC8" transform="rotate(2 140 95)"/>
    <rect x="6" y="0" width="260" height="150" rx="4" fill="#FBF9F3" stroke="#C9BB9E" stroke-width="1.5"/>
    <line x1="26" y1="30" x2="230" y2="30" stroke="#A63D32" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="26" y1="55" x2="200" y2="55" stroke="#4E4842" stroke-opacity="0.25" stroke-width="2"/>
    <line x1="26" y1="78" x2="215" y2="78" stroke="#4E4842" stroke-opacity="0.2" stroke-width="2"/>
    <line x1="26" y1="101" x2="180" y2="101" stroke="#4E4842" stroke-opacity="0.2" stroke-width="2"/>
    <!-- string wrap -->
    <path d="M46 -6 C 46 60, 46 90, 46 156" fill="none" stroke="#A63D32" stroke-opacity="0.55" stroke-width="3"/>
    <circle cx="46" cy="76" r="7" fill="#A63D32" opacity="0.6"/>
  </g>

  <!-- open notebook -->
  <g transform="translate(260,220)">
    <path d="M0 30 C 90 -6, 180 -6, 270 30 L 270 300 C 180 264, 90 264, 0 300 Z" fill="#FBF9F3" stroke="#C9BB9E" stroke-width="1.5"/>
    <path d="M270 30 C 360 -6, 450 -6, 540 30 L 540 300 C 450 264, 360 264, 270 300 Z" fill="#F5F0E7" stroke="#C9BB9E" stroke-width="1.5"/>
    <line x1="270" y1="30" x2="270" y2="300" stroke="#A63D32" stroke-opacity="0.45" stroke-width="2"/>

    <!-- handwritten-style abstract note lines, left page -->
    <g stroke="#4E4842" stroke-opacity="0.4" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M40 90 C 80 82, 120 96, 160 86 C 190 80, 210 92, 232 84"/>
      <path d="M40 118 C 90 108, 140 126, 200 112"/>
      <path d="M40 146 C 70 140, 110 152, 150 142"/>
    </g>
    <!-- burgundy numbered annotation echoing site style -->
    <g transform="translate(46,190)">
      <circle r="11" fill="#A63D32"/>
      <text x="0" y="4" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#FFFAF4">01</text>
    </g>
    <line x1="70" y1="190" x2="220" y2="190" stroke="#A63D32" stroke-opacity="0.3" stroke-width="2"/>

    <!-- abstract brush-stroke marks, right page -->
    <g stroke="#A63D32" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M330 90 L 330 190"/>
      <path d="M300 120 L 366 120"/>
      <path d="M410 80 C 428 118, 396 168, 424 210"/>
      <path d="M470 96 L 470 190"/>
      <path d="M446 140 L 500 140"/>
    </g>
  </g>

  <!-- fountain pen resting diagonally -->
  <g transform="translate(210,540) rotate(-28)">
    <rect x="0" y="0" width="280" height="14" rx="7" fill="#292522"/>
    <rect x="0" y="0" width="70" height="14" rx="7" fill="#A63D32"/>
    <polygon points="280,0 300,7 280,14" fill="#D9B495"/>
  </g>

  <!-- thin frame rules -->
  <g stroke="#292522" stroke-opacity="0.14" stroke-width="1.5">
    <line x1="60" y1="70" x2="60" y2="180"/>
    <line x1="60" y1="70" x2="150" y2="70"/>
  </g>
</svg>
